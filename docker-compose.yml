services:
  warehouse:
    image: postgres:16
    container_name: cartflow-warehouse
    environment:
      POSTGRES_USER: cartflow
      POSTGRES_PASSWORD: cartflow
      POSTGRES_DB: cartflow
    ports:
      - "5433:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartflow"]
      interval: 5s
      retries: 10
  
  metabase:
    image: metabase/metabase:latest
    container_name: cartflow-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      - warehouse

volumes:
  warehouse-data:
  metabase-data: